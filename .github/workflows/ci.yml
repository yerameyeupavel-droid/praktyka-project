name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wymagana struktura katalogów
        run: |
          test -f README.md
          test -f docs/design.md
          test -f docs/erd.md
          test -f database/schema.sql
          test -f frontend/index.html
          echo "Struktura OK"

      - name: Podgląd składni SQL (opcjonalnie)
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            echo "psql niedostępny - pomijam walidację live"
          fi
