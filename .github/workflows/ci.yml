name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wymagana struktura katalogow
        run: |
          test -f README.md
          test -f database/table-schema.sql
          test -f database/insert-data.sql
          test -f database/select-training.sql
          test -f frontend/index.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js
          test -f frontend/data/tasks.json
          test -d docs
          echo "Struktura OK"

      - name: Dokumentacja
        run: |
          test -f docs/design.md
          test -f docs/erd.md
          echo "Dokumentacja OK"

      - name: Szybki podglad SQL
        run: |
          grep -i "create table comment" database/table-schema.sql
          grep -i "insert into comment" database/insert-data.sql
          echo "SQL wyglada ok"
