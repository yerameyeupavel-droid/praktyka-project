name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wymagana struktura katalogow
        run: |
          test -f README.md
          test -f database/table-schema.sql
          test -f database/insert-data.sql
          test -f database/select-training.sql
          test -f frontend/index.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js
          test -f frontend/data/tasks.json
          test -f backend/TaskManager.Api/Program.cs
          test -f backend/TaskManager.Api/appsettings.json
          test -d docs
          echo "Struktura OK"

      - name: Dokumentacja
        run: |
          test -f docs/design.md
          test -f docs/erd.md
          test -f backend/README.md
          echo "Dokumentacja OK"

      - name: Szybki podglad SQL
        run: |
          grep -i "create table comment" database/table-schema.sql
          grep -i "insert into comment" database/insert-data.sql
          echo "SQL wyglada ok"

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/TaskManager.Api/TaskManager.Api.csproj

      - name: Build
        run: dotnet build backend/TaskManager.Api/TaskManager.Api.csproj --no-restore
